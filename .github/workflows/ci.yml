name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Checksum
        run: sha256sum dist/kotono-cms.html | tee dist/kotono-cms.html.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kotono-cms
          path: |
            dist/kotono-cms.html
            dist/kotono-cms.html.sha256
